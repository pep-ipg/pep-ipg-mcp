# Reverse proxy with TLS in front of pep-ipg-mcp.
# Get a certificate first, e.g.: sudo certbot --nginx -d mcp.example.ir
server {
    listen 443 ssl http2;
    server_name mcp.example.ir;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.ir/privkey.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name mcp.example.ir;
    return 301 https://$host$request_uri;
}
