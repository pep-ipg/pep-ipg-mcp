name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Skill references are in sync with data/
        run: |
          npm run build:skill
          git diff --exit-code -- skills/ || (echo "::error::Run 'npm run build:skill' and commit skills/pep-ipg/references" && exit 1)
