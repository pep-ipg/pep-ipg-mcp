name: Release

# Push a tag like v1.1.0 to publish:
#   - npm package (npx pep-ipg-mcp)
#   - Claude Desktop extension (.mcpb) attached to a GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance
  packages: write   # push the Docker image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json and manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MAN" ]; then
            echo "::error::tag v$TAG, package.json $PKG, manifest.json $MAN must match"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Skipped when NPM_TOKEN is unset or this version is already on npm
      # (for example, published by hand). A failure here does not block the
      # GitHub Release below.
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        continue-on-error: true
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "pep-ipg-mcp@$VER" version >/dev/null 2>&1; then
            echo "pep-ipg-mcp@$VER is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Build Claude Desktop extension (.mcpb)
        run: |
          npm prune --omit=dev
          npx -y @anthropic-ai/mcpb pack . pep-ipg-mcp.mcpb

      - name: Package the skill for claude.ai
        run: cd skills && zip -r ../pep-ipg-skill.zip pep-ipg

      - name: Create GitHub Release
        if: ${{ always() }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pep-ipg-mcp.mcpb
            pep-ipg-skill.zip
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
